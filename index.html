
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Email Visualizer</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
      // Shim process.env for browser environments to prevent ReferenceErrors
      window.process = window.process || { env: { API_KEY: "" } };
    </script>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react-dom/client": "https://esm.sh/react-dom@^19.2.4/client",
    "html-to-image": "https://esm.sh/html-to-image@^1.11.11"
  }
}
</script>
<style>
  /* Explicit styles for the capture area to ensure they are visible to the capture library */
  #email-capture-area {
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    color: #111827;
    background-color: white;
  }
  
  /* Ensure off-screen rendering doesn't hide elements from computed styles */
  #capture-container {
    position: fixed;
    top: 0;
    left: -9999px;
    width: 600px;
    height: auto;
    overflow: visible;
  }

  .email-content-wrapper img {
    max-width: 100% !important;
    height: auto !important;
  }

  /* Loading state while React mounts */
  #root:empty::before {
    content: "INITIALIZING STUDIO...";
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: sans-serif;
    color: #cbd5e1;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 0.3em;
  }
</style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
